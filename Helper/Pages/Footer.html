<style type="text/css">
    .tblFooter {
        border: blue thin solid;
        border-radius: 4px 4px;
        width: 99vw;
        max-height: 20px;
        /*width:95vw;*/
        padding: 0px;
        margin: 0px;
        overflow: hidden;
        left: 0px;
    }

    .tblFooter input[type=text][readonly] {
        max-height: 20px;
        font-family: Tahoma;
        font-size: 9pt;
        width: 7vw;
        overflow: hidden;
        color: darkblue;
        text-size-adjust: auto;
        background-color: transparent;
        border: none;
    }

    .tblFooter input[type=text][disabled] {
        max-height: 20px;
        font-family: Tahoma;
        font-weight: bold;
        font-size: 10pt;
        overflow: hidden;
        border: 1px groove blue;
        text-size-adjust: auto;
        text-align: left;
        width: 15vw;
    }
</style>

<table class="tblFooter" cellpadding="0" cellspacing="0">
    <tr>
        <td>
            <input type="text"  value="Created By" readonly tabindex="-1"/>
        </td>
        <td>
            <input type="text" ng-model="footer.CreatedBy" disabled id ="ftrCreatedBy" />
        </td>
        <td>
            <input type="text" value="Created On" readonly tabindex="-1"/>
        </td>
        <td>
            <input type="text" ng-model="footer.CreatedOn" datetime="yyyy-MM-dd HH:mm:ss" disabled />
        </td>
        <td>
            <input type="text" value="Updated By" readonly tabindex="-1"/>
        </td>
        <td>
            <input type="text" ng-model="footer.UpdatedBy" disabled />
        </td>
        <td>
            <input type="text" value="Updated On" readonly tabindex="-1"/>
        </td>
        <td>
            <input type="text" ng-model="footer.UpdatedOn" datetime="yyyy-MM-dd HH:mm:ss" disabled />
        </td>
    </tr>
</table>

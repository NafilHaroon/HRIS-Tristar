<div ng-app="HRIS">
    <div ng-controller="ChgPwdController" ng-init="chgPwdFormLoaded()" id="ngChangePwd">
        <fieldset>
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Its time to change Password!</h3>
            </div>
            <div class="modal-body">
                <div>
                    <label class="mandatoryKey">Old Password</label>
                </div>
                <div>
                    <input id="oldPassword" name="oldPassword" type="password" data-ng-model="CP.OldPassword" placeholder="Enter Current Password Here" required />
                    <label ng-hide="CP.OldPassword != null" class="errorMsg">Please enter Current Password</label>
                </div>

                <div>
                    <label class="mandatoryKey">New Password</label>
                </div>
                <div>
                    <input id="newPassword" name="newPassword" type="password" data-ng-model="CP.NewPassword" required />
                    <label ng-hide="CP.NewPassword != null" class="errorMsg">Please enter New Password</label>
                </div>

                <div>
                    <label class="mandatoryKey">Confirm New Password</label>
                </div>
                <div>
                    <input id="cfmPassword" name="cfmPassword" type="password" data-ng-model="CP.ConfirmPassword" required />
                    <label ng-hide="CP.ConfirmPassword != null" class="errorMsg">Please enter Confirm Password</label>
                </div>
                <div>
                    <ul style="list-style-type:square; color:red;">
                        <li ng-hide="CP.OldPassword != CP.NewPassword">Old & New password can't be same</li>
                        <li ng-hide="!pwdNonCompliant()">New password lenght must be minimum 8</li>
                        <li ng-hide="CP.NewPassword == CP.ConfirmPassword">New password & Confirm Password must be same</li>
                    </ul>
                </div>
                <div class="validation-summary-errors" ng-if="errors && errors.length > 0">
                    Validation Errors:<br />
                    <span data-ng-repeat="error in errors">{{error}}<br /></span>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btnChangePassword" ng-click="tbChgPwd()" 
                    ng-disabled="pwdNonCompliant()">Change Password</button>
                <button type="button" id="btnCancel" ng-click="modalInstance.close('cancel');">Cancel</button>
            </div>
        </fieldset>
    </div>
    <link href='/HRIS/Areas/Common/CSS/ChangePassword.css' rel="stylesheet" type="text/css" />
</div>
